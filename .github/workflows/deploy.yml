name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Without a custom domain the site lives at https://<owner>.github.io/<repo>/.
      # Once public/CNAME exists, the site is served from the domain root.
      - name: Build
        run: |
          if [ -f public/CNAME ]; then
            export SITE="https://$(tr -d '[:space:]' < public/CNAME)" BASE=/
          else
            export SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io" BASE="/${GITHUB_REPOSITORY#*/}"
          fi
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
